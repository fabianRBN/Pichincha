version: '3.8'
services:
    zookeeper:
      image: confluentinc/cp-zookeeper:latest
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
      ports:
        - "2181:2181"

    kafka:
      image: confluentinc/cp-kafka:latest
      depends_on:
        - zookeeper
      environment:
        KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      ports:
        - "9092:9092"
    java_app:
      build:
        context: ./client-crud
        dockerfile: Dockerfile
      container_name: pichincha-crud
      depends_on:
        - db
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pichincha
        SPRING_DATASOURCE_USERNAME: pichincha
        SPRING_DATASOURCE_PASSWORD: ftoapanta
      ports:
        - '8081:8081'
    java_app_account:
      build:
        context: ./account-crud
        dockerfile: Dockerfile
      container_name: pichincha-crud-account
      depends_on:
        - db
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pichincha
        SPRING_DATASOURCE_USERNAME: pichincha
        SPRING_DATASOURCE_PASSWORD: ftoapanta
      ports:
        - '8082:8082'
    angular:
      build:
        context: ./../pichincha-Frontend
        dockerfile: Dockerfile
      container_name: pichincha-frontend
      ports:
        - '8080:8080'
      depends_on:
        - java_app
        - java_app_account
    db:
      image: postgres:16.1
      container_name: db-pichincha
      restart: always
      volumes:
        - ./../sql/create_schema_bp.sql:/docker-entrypoint-initdb.d/create_schema.sql
        - ./../sql/data.sql:/docker-entrypoint-initdb.d/data.sql
      environment:
        POSTGRES_DB: 'pichincha'
        POSTGRES_USER: 'pichincha'
        POSTGRES_PASSWORD: 'ftoapanta'
      ports:
        - '5432:5432'